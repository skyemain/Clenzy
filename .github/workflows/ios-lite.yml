name: iOS Lite candidate
on:
  push:
    branches: [ios-lite]
  pull_request:
    branches: [ios-lite]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-lite-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: python3 scripts/generate-xcodeproj.py
      - name: Build and test on iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if "iPhone" in x["name"]))')
          echo "IOS_SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
          xcodebuild -project ClenzyLite.xcodeproj -scheme ClenzyLite -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build-for-testing
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/DerivedData/Build/Products/Debug-iphonesimulator/ClenzyLite.app
          xcrun simctl privacy "$DEVICE" grant photos com.skyemain.clenzylite.ios
          swift scripts/make-test-media.swift build/TestMedia
          xcrun simctl addmedia "$DEVICE" build/TestMedia/*.jpg
          xcrun simctl addmedia "$DEVICE" build/TestMedia/video.mov
          xcodebuild -project ClenzyLite.xcodeproj -scheme ClenzyLite -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -derivedDataPath build/DerivedData -resultBundlePath build/Tests.xcresult CODE_SIGNING_ALLOWED=NO test-without-building
      - name: Capture launch screen
        timeout-minutes: 3
        run: |
          xcrun simctl boot "$IOS_SIMULATOR_ID" || true
          xcrun simctl bootstatus "$IOS_SIMULATOR_ID" -b
          xcrun simctl install "$IOS_SIMULATOR_ID" build/DerivedData/Build/Products/Debug-iphonesimulator/ClenzyLite.app
          xcrun simctl status_bar "$IOS_SIMULATOR_ID" override --time '9:41'
          xcrun simctl launch "$IOS_SIMULATOR_ID" com.skyemain.clenzylite.ios
          sleep 3
          xcrun simctl io "$IOS_SIMULATOR_ID" screenshot build/Clenzy-Lite-launch.png
      - name: Build device archive (unsigned)
        run: xcodebuild -project ClenzyLite.xcodeproj -scheme ClenzyLite -destination 'generic/platform=iOS' -archivePath build/ClenzyLite.xcarchive CODE_SIGNING_ALLOWED=NO archive
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Clenzy-Lite-iOS-tests
          path: build/Tests.xcresult
      - uses: actions/upload-artifact@v4
        with:
          name: Clenzy-Lite-1.0-iOS-unsigned
          path: |
            build/ClenzyLite.xcarchive
            build/Clenzy-Lite-launch.png
      - uses: actions/upload-artifact@v4
        with:
          name: Clenzy-Lite-1.0-iOS-simulator
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/ClenzyLite.app

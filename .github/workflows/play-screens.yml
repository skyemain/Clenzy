name: Clenzy Lite Play screenshots
on:
  push:
    branches: [android-lite-play]
    paths: [.github/workflows/play-screens.yml, app/src/androidTest/**]
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          profile: pixel_5
          arch: x86_64
          cores: 2
          ram-size: 3072M
          disable-animations: true
          script: |
            adb shell wm size 1080x1920
            adb shell wm density 360
            adb shell wm dismiss-keyguard
            adb shell am force-stop com.android.launcher3
            sleep 5
            gradle connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.skyemain.clenzylite.LiteJourneyTest#capturePlayListingScreens -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true
            mkdir -p screenshots
            adb pull /sdcard/Android/data/com.skyemain.clenzylite/files/gallery.png screenshots/
            adb pull /sdcard/Android/data/com.skyemain.clenzylite/files/options.png screenshots/
      - uses: actions/upload-artifact@v4
        with:
          name: Clenzy-Lite-Play-screenshots
          path: screenshots/
          if-no-files-found: error

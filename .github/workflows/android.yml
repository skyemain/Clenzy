name: Android candidate
on:
  push:
    branches: [android]
    paths-ignore: ['release/**']
  pull_request:
    branches: [android]
  workflow_dispatch:
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false
      - name: Restore release signing identity
        env:
          KEYSTORE: ${{ secrets.CLENZY_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CLENZY_STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$STORE_PASSWORD" ]; then
            umask 077
            printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/clenzy-release.p12"
            echo "CLENZY_KEYSTORE=$RUNNER_TEMP/clenzy-release.p12" >> "$GITHUB_ENV"
          else
            echo 'Release signing secrets not configured; unsigned release retained for local signing.'
          fi
      - name: Fetch verified offline vision model
        run: |
          bash build/fetch-vision.sh
          mkdir -p app/src/androidTest/assets
          curl -fL --retry 3 'https://raw.githubusercontent.com/scikit-image/scikit-image/v0.20.0/skimage/data/astronaut.png' -o app/src/androidTest/assets/person.png
          curl -fL --retry 3 'https://raw.githubusercontent.com/scikit-image/scikit-image/v0.20.0/skimage/data/chelsea.png' -o app/src/androidTest/assets/pet.png
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'testsrc2=size=1280x720:rate=24' \
            -f lavfi -i 'sine=frequency=440:sample_rate=48000' -t 2 \
            -c:v libx264 -preset ultrafast -crf 12 -pix_fmt yuv420p -c:a aac \
            app/src/androidTest/assets/compress-fixture.mp4
      - name: Build and test
        env:
          CLENZY_STORE_PASSWORD: ${{ secrets.CLENZY_STORE_PASSWORD }}
        run: |
          gradle testDebugUnitTest lintDebug assembleDebug assembleRelease bundleRelease assembleDebugAndroidTest || {
            find app/build -name 'lint-results-debug.txt' -exec awk '/Error:/{print}' {} +
            exit 1
          }
      - name: Build and validate Play bundle and ARM64 APK
        env:
          CLENZY_STORE_PASSWORD: ${{ secrets.CLENZY_STORE_PASSWORD }}
        run: |
          gradle assembleRelease -PclenzyArm64
          apk=$(find app/build/outputs/apk/release -name 'app-release*.apk' -print -quit)
          test -n "$apk"
          bash build/check-play-bundle.sh app/build/outputs/bundle/release/app-release.aab "$apk"
      - name: Verify release signature
        if: env.CLENZY_KEYSTORE != ''
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          profile: pixel_5
          arch: x86_64
          cores: 2
          ram-size: 3072M
          disable-animations: true
          script: |
            adb shell wm size 720x1280
            adb shell wm density 280
            adb shell wm dismiss-keyguard
            adb shell am force-stop com.android.launcher3
            sleep 5
            gradle connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || { find app/build/outputs/androidTest-results -name '*.xml' -exec cat {} +; adb logcat -d -s AndroidRuntime System.err; mkdir -p screenshots; adb pull /sdcard/Android/data/com.skyemain.clenzy/files/. screenshots/; adb exec-out screencap -p > screenshots/failure.png; exit 1; }
            adb shell am force-stop com.skyemain.clenzy
            adb shell am start -n com.skyemain.clenzy/.HomeActivity
            sleep 3
            mkdir -p screenshots
            adb logcat -d -s ClenzyBenchmark:I > screenshots/scan-benchmark.txt
            adb exec-out screencap -p > screenshots/Clenzy-Android-home.png
            adb pull /sdcard/Android/data/com.skyemain.clenzy/files/Clenzy-Android-review.png screenshots/Clenzy-Android-review.png
            adb pull /sdcard/Android/data/com.skyemain.clenzy/files/Clenzy-Android-light.png screenshots/
            adb pull /sdcard/Android/data/com.skyemain.clenzy/files/Clenzy-Android-dark.png screenshots/
            adb pull /sdcard/Android/data/com.skyemain.clenzy/files/Clenzy-Android-cleanup.png screenshots/
            adb pull /sdcard/Android/data/com.skyemain.clenzy/files/Clenzy-Android-settings.png screenshots/
            adb pull /sdcard/Android/data/com.skyemain.clenzy/files/Clenzy-Android-selection.png screenshots/
            adb pull /sdcard/Android/data/com.skyemain.clenzy/files/Clenzy-Android-results.png screenshots/
            adb pull /sdcard/Android/data/com.skyemain.clenzy/files/Clenzy-AI-gallery.png screenshots/
            adb pull /sdcard/Android/data/com.skyemain.clenzy/files/Clenzy-AI-menu.png screenshots/
            adb pull /sdcard/Android/data/com.skyemain.clenzy/files/Clenzy-AI-progress.png screenshots/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Clenzy-Android-screenshots
          path: screenshots/
      - uses: actions/upload-artifact@v4
        with:
          name: Clenzy-Android-candidate
          path: |
            app/build/outputs/apk/
            app/build/outputs/bundle/
      - name: Publish signed release candidate
        if: github.event_name != 'pull_request' && env.CLENZY_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin android
          if [ "$(git rev-parse origin/android)" != "${{ github.sha }}" ]; then exit 0; fi
          mkdir -p release
          rm -f release/Clenzy-*-android-candidate.apk
          cp app/build/outputs/apk/release/app-release.apk release/Clenzy-1.0-android-arm64.apk
          cp app/build/outputs/bundle/release/app-release.aab release/Clenzy-1.0-android-play.aab
          (cd release && sha256sum Clenzy-1.0-android-arm64.apk Clenzy-1.0-android-play.aab > SHA256SUMS.txt)
          tag="android-v1.0-build-${GITHUB_RUN_NUMBER}"
          apk="release/Clenzy-1.0-android-arm64.apk"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "Clenzy Android 1.0" --notes "Signed ARM64 APK for direct installation and Android App Bundle for Google Play submission. Includes offline AI Smart Clean." --prerelease --latest=false
          fi
          gh release upload "$tag" "$apk" release/Clenzy-1.0-android-play.aab release/SHA256SUMS.txt --clobber
          printf 'https://github.com/%s/releases/download/%s/%s\n' "$GITHUB_REPOSITORY" "$tag" "$(basename "$apk")" > release/ANDROID-DOWNLOAD.txt
          rm "$apk" release/Clenzy-1.0-android-play.aab
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release
          git diff --cached --quiet && exit 0
          git commit -m 'Publish signed Android candidate [skip ci]'
          git push origin HEAD:android

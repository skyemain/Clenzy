name: Clenzy Play upload bundle
on:
  push:
    branches: [android-play]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Fetch verified offline model
        run: bash build/fetch-vision.sh
      - name: Build signed upload bundle
        env:
          SIGNING_KEY: ${{ secrets.CLENZY_KEYSTORE_BASE64 }}
          CLENZY_STORE_PASSWORD: ${{ secrets.CLENZY_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY" && test -n "$CLENZY_STORE_PASSWORD"
          umask 077
          export CLENZY_KEYSTORE="$RUNNER_TEMP/clenzy-upload.p12"
          trap 'rm -f "$CLENZY_KEYSTORE"' EXIT
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$CLENZY_KEYSTORE"
          unset SIGNING_KEY
          export GITHUB_RUN_NUMBER=$((10000 + GITHUB_RUN_NUMBER))
          gradle --no-daemon testDebugUnitTest lintDebug bundleRelease
          mkdir -p upload
          cp app/build/outputs/bundle/release/app-release.aab upload/Clenzy-play.aab
          jarsigner -verify upload/Clenzy-play.aab | tee upload/signature-check.txt
          grep -q 'jar verified' upload/signature-check.txt
      - name: Validate bundle and inspect its manifest
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar -o "$RUNNER_TEMP/bundletool.jar"
          aab=upload/Clenzy-play.aab
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="$aab"
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$aab" > upload/manifest.xml
          grep -q 'targetSdkVersion="36"' upload/manifest.xml
          java -jar "$RUNNER_TEMP/bundletool.jar" dump config --bundle="$aab" > upload/bundle-config.txt
          grep -q PAGE_ALIGNMENT_16K upload/bundle-config.txt
          unzip -q "$aab" 'base/lib/*/*.so' -d "$RUNNER_TEMP/native"
          while IFS= read -r -d '' lib; do
            readelf -lW "$lib" | awk '$1 == "LOAD" { if (($NF + 0) < 16384) exit 1; found=1 } END { if (!found) exit 1 }' || { echo "Unaligned library: $lib"; exit 1; }
          done < <(find "$RUNNER_TEMP/native" -name '*.so' -print0)
          (cd upload && sha256sum *.aab > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Clenzy-Play-upload
          path: upload/
          if-no-files-found: error

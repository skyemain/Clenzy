name: Clenzy Play upload bundle
on:
  push:
    branches: [android-play]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Fetch verified offline model
        run: bash build/fetch-vision.sh
      - name: Build signed upload bundle
        env:
          SIGNING_KEY: ${{ secrets.CLENZY_KEYSTORE_BASE64 }}
          CLENZY_STORE_PASSWORD: ${{ secrets.CLENZY_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY" && test -n "$CLENZY_STORE_PASSWORD"
          umask 077
          export CLENZY_KEYSTORE="$RUNNER_TEMP/clenzy-upload.p12"
          trap 'rm -f "$CLENZY_KEYSTORE"' EXIT
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$CLENZY_KEYSTORE"
          unset SIGNING_KEY
          export GITHUB_RUN_NUMBER=$((10000 + GITHUB_RUN_NUMBER))
          gradle --no-daemon testDebugUnitTest lintDebug bundleRelease
          mkdir -p upload
          cp app/build/outputs/bundle/release/app-release.aab upload/Clenzy-play.aab
          jarsigner -verify upload/Clenzy-play.aab | tee upload/signature-check.txt
          grep -q 'jar verified' upload/signature-check.txt
      - name: Validate bundle and inspect its manifest
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar -o "$RUNNER_TEMP/bundletool.jar"
          aab=upload/Clenzy-play.aab
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="$aab"
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$aab" > upload/manifest.xml
          grep -q 'targetSdkVersion="36"' upload/manifest.xml
          java -jar "$RUNNER_TEMP/bundletool.jar" dump config --bundle="$aab" > upload/bundle-config.txt
          grep -q PAGE_ALIGNMENT_16K upload/bundle-config.txt
          python3 - "$aab" <<'PY'
          import struct
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as bundle:
              for abi in ("arm64-v8a", "x86_64"):
                  libraries = [name for name in bundle.namelist()
                               if name.startswith(f"base/lib/{abi}/") and name.endswith(".so")]
                  assert libraries, f"Missing 64-bit libraries for {abi}"
                  for name in libraries:
                      with bundle.open(name) as library:
                          header = library.read(64)
                          assert header[:5] == b"\x7fELF\x02", f"Invalid 64-bit ELF: {name}"
                          endian = "<" if header[5] == 1 else ">"
                          offset = struct.unpack_from(endian + "Q", header, 32)[0]
                          stride, count = struct.unpack_from(endian + "HH", header, 54)
                          library.seek(offset)
                          segments = [library.read(stride) for _ in range(count)]
                          alignments = [struct.unpack_from(endian + "Q", segment, 48)[0]
                                        for segment in segments
                                        if struct.unpack_from(endian + "I", segment)[0] == 1]
                          assert alignments and min(alignments) >= 16384, f"Unaligned library: {name}: {alignments}"
                          print(f"16 KB aligned: {name}")
          PY
          (cd upload && sha256sum *.aab > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Clenzy-Play-upload
          path: upload/
          if-no-files-found: error

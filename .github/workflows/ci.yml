name: Windows candidate
on:
  push:
    branches: [windows, windows-redesign-test]
    paths-ignore: ['release/**']
  pull_request:
    branches: [windows, windows-redesign-test]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    if: "!contains(github.event.head_commit.message, '[validation only]')"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build, test and package
        shell: pwsh
        run: ./build/publish.ps1 -Release -ToRelease
      - name: Test maintenance operation contracts
        shell: powershell
        run: ./tests/Windows11Maintenance.Tests.ps1
      - name: Validate PowerShell 5.1 module syntax
        shell: powershell
        run: |
          $errors = $null; $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'src/Clenzy.Windows/Windows11/Maintenance.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Exercise sandbox UI without host changes
        shell: pwsh
        run: |
          $app = Start-Process -FilePath 'artifacts/release/Clenzy-1.0.0-win-x64.exe' -ArgumentList '--windows11-smoke' -PassThru
          if (-not $app.WaitForExit(60000)) { $app.Kill(); throw 'UI smoke test timed out' }
          if ($app.ExitCode -ne 0) { Get-Content "$env:TEMP/Clenzy-Windows11-smoke-error.txt" -ErrorAction SilentlyContinue; throw 'UI smoke test failed' }
          New-Item -ItemType Directory -Force screenshots | Out-Null
          Copy-Item "$env:TEMP/Clenzy-Windows11-sandbox.png" screenshots/
      - uses: actions/upload-artifact@v4
        with:
          name: Clenzy-Windows11-sandbox-screenshot
          path: screenshots/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Clenzy-windows-candidate
          path: artifacts/release/*
          if-no-files-found: error
      - name: Publish candidate to Windows branch
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git fetch origin "$env:TARGET_BRANCH"
          if ((git rev-parse "origin/$env:TARGET_BRANCH") -ne '${{ github.sha }}') { exit 0 }
          'RELEASE_READY=true' >> $env:GITHUB_ENV
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A release
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m 'Publish Windows candidate [skip ci]'
          git push origin "HEAD:$env:TARGET_BRANCH"

      - name: Publish GitHub prerelease
        if: github.event_name != 'pull_request' && env.RELEASE_READY == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if ($env:TARGET_BRANCH -eq 'windows') {
            $tag = 'windows-v1.0.0'
            $title = 'Clenzy 1.0.0 for Windows'
          } else {
            $tag = $env:TARGET_BRANCH
            $title = "Clenzy Windows candidate ($env:TARGET_BRANCH)"
          }
          gh release create $tag release/Clenzy-1.0.0-win-x64.exe release/SHA256SUMS.txt release/THIRD-PARTY-NOTICES.txt --target '${{ github.sha }}' --title $title --prerelease --latest=false --notes 'Expands Windows 11 Cleanup with a shared 79-action catalog: 47 optional apps, advertising/privacy preferences, Recall policy, selective startup and guarded optional services. Reuses reviewed disk cleanup, preserves security and gaming dependencies, and records verified changes and rollback. Windows x64 unsigned candidate; live Windows 11 validation remains outstanding.'
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }

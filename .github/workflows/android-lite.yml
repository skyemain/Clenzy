name: Clenzy Lite APK
on:
  push:
    branches: [andriod-lite]
  workflow_dispatch:

concurrency:
  group: clenzy-lite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lite:
    if: github.ref == 'refs/heads/andriod-lite'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Set up release signing
        env:
          KEYSTORE: ${{ secrets.CLENZY_KEYSTORE_BASE64 }}
          CLENZY_STORE_PASSWORD: ${{ secrets.CLENZY_STORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$CLENZY_STORE_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/clenzy-lite.p12"
          echo "CLENZY_KEYSTORE=$RUNNER_TEMP/clenzy-lite.p12" >> "$GITHUB_ENV"
      - name: Build and check universal APK
        env:
          CLENZY_STORE_PASSWORD: ${{ secrets.CLENZY_STORE_PASSWORD }}
        run: |
          gradle testDebugUnitTest lintDebug assembleRelease assembleDebugAndroidTest || {
            find app/build -name 'lint-results-debug.txt' -exec awk '/Error:/{print}' {} +
            exit 1
          }
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          if unzip -Z1 "$apk" | grep -E '^lib/.*\.so$'; then
            echo 'Lite should use platform codecs with no bundled native libraries.'
            exit 1
          fi
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          profile: pixel_5
          arch: x86_64
          cores: 2
          ram-size: 3072M
          disable-animations: true
          script: |
            adb shell wm size 720x1280
            adb shell wm density 280
            adb shell wm dismiss-keyguard
            adb shell am force-stop com.android.launcher3
            gradle connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || { find app/build/outputs/androidTest-results -name '*.xml' -exec cat {} +; adb logcat -d -s AndroidRuntime ClenzyLite VideoView MediaPlayer MediaCodec; exit 1; }
            adb uninstall com.skyemain.clenzylite
            adb install app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n com.skyemain.clenzylite/.LiteActivity | tee launch.txt
            grep -q 'Status: ok' launch.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Clenzy-Lite-APK
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish signed universal APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin andriod-lite
          test "$(git rev-parse origin/andriod-lite)" = "$GITHUB_SHA"
          version=$(cat VERSION)
          tag="android-lite-v${version}-build-${GITHUB_RUN_NUMBER}"
          apk="Clenzy-Lite-${version}-android-universal.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > SHA256SUMS.txt
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "Clenzy Lite $version" --notes "Signed universal APK. Requires Android 11 or later. Installs alongside Clenzy." --prerelease --latest=false
          fi
          gh release upload "$tag" "$apk" SHA256SUMS.txt --clobber

plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'com.skyemain.clenzy'
    compileSdk 35
    defaultConfig {
        applicationId 'com.skyemain.clenzy'
        minSdk 26
        targetSdk 35
        versionCode = ((System.getenv("GITHUB_RUN_NUMBER") ?: "2").toInteger() + 100)
        versionName '2.1.2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    kotlinOptions { jvmTarget = '17' }
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (System.getenv('CLENZY_KEYSTORE')) {
                storeFile file(System.getenv('CLENZY_KEYSTORE'))
                storePassword System.getenv('CLENZY_STORE_PASSWORD')
                keyAlias 'clenzy'
                keyPassword System.getenv('CLENZY_STORE_PASSWORD')
            }
        }
    }
    buildTypes { release { minifyEnabled false; if (System.getenv('CLENZY_KEYSTORE')) signingConfig signingConfigs.release } }

}
dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.google.mlkit:text-recognition-devanagari:16.0.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:image-labeling:17.0.9'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.google.mlkit:face-detection:16.1.7'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}

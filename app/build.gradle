plugins { id 'com.android.application' }
android {
    namespace 'com.skyemain.clenzylite'
    compileSdk 36
    defaultConfig {
        applicationId 'com.skyemain.clenzylite'
        minSdk 30
        targetSdk 36
        versionName rootProject.file('VERSION').text.trim()
        versionCode = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (System.getenv('CLENZY_KEYSTORE')) {
                storeFile file(System.getenv('CLENZY_KEYSTORE'))
                storePassword System.getenv('CLENZY_STORE_PASSWORD')
                keyAlias 'clenzy'
                keyPassword System.getenv('CLENZY_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('CLENZY_KEYSTORE')) signingConfig signingConfigs.release
        }
    }
}
dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.activity:activity:1.9.3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
